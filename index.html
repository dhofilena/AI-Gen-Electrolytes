<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />

  <script>

    document.documentElement.classList.remove('no-js');
    document.documentElement.classList.add('js');

</head>

<body>

  <main id="main">
    <!-- Each section is an isolated, independently-judged piece.
         A section owns: its markup (JS-rendered), its CSS file, its motion.
         Sections communicate ONLY through tokens.css + content.js. -->

    <section class="section hero" id="hero" data-module="hero" data-surface="dark"></section>

    <section class="section myth" id="myth" data-module="myth" data-surface="dark"></section>

    <section class="section science" id="science" data-module="science" data-surface="dark"></section>

    <section class="section pillars" id="pillars" data-module="pillars" data-surface="bone"></section>

    <section class="section compare" id="compare" data-module="compare" data-surface="light"></section>

  <footer class="footer" id="footer" data-module="footer" data-surface="dark"></footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
